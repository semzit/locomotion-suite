[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weir"
version = "0.1.0"
description = "Train a simulated legged robot to walk using reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "omegaconf>=2.3,<3.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.3",
    "pre-commit>=4.0",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["weir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=weir --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["weir"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["weir", "tests"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
