[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locomotion-suite"
version = "0.1.0"
description = "Config-driven, plugin-based humanoid RL platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beartype>=0.22.9",
    "omegaconf>=2.3,<3.0",
  "hydra-core>=1.3.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
  "hypothesis>=6.165.3",
  "pre-commit>=4.0",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
locomotion = "core.cli:main"
locomotion-hydra = "core.cli:hydra_main"

[tool.hatch.build.targets.wheel]
packages = ["core", "plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=plugins --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["core", "plugins"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["core", "plugins", "tests"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
