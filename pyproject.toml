[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locomotio-suite"
version = "0.1.0"
description = "Config-driven, plugin-based humanoid RL platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "PyYAML>=6.0"]

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "pyright>=1.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
locomotio = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=plugins --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["core", "plugins"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["core", "plugins", "tests"]
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = false
reportMissingModuleSource = "none"
